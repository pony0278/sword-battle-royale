name: G3.6 Power Parry Motion Continuity

on:
  pull_request:
    paths:
      - 'src/animation/parry-rotation-continuity.js'
      - 'src/animation/parry-upper-body-continuity.js'
      - 'src/animation/skyrim-converted-animation-library.js'
      - 'src/animation/parry-contact-deflect-runtime-clip.js'
      - 'src/combat/guard-*.js'
      - 'src/combat/longsword-guard-correction.js'
      - 'tools/action-studio/parry-rotation-continuity-lab.*'
      - 'tests/guard-correction-idempotence.test.js'
      - 'tests/parry-rotation-continuity.test.js'
      - 'tests/parry-upper-body-continuity.test.js'
      - '.github/workflows/parry-rotation-continuity.yml'
  # R21H.1: these gates only ever fired on pull_request, and this repository reaches main by
  # fast-forward rather than by pull request - so this workflow had never run, not once. The paths
  # filter below is what keeps that cheap: the gate wakes only when the code it guards moves.
  push:
    branches: ['**']
    paths:
      - 'src/animation/parry-rotation-continuity.js'
      - 'src/animation/parry-upper-body-continuity.js'
      - 'src/animation/skyrim-converted-animation-library.js'
      - 'src/animation/parry-contact-deflect-runtime-clip.js'
      - 'src/combat/guard-*.js'
      - 'src/combat/longsword-guard-correction.js'
      - 'tools/action-studio/parry-rotation-continuity-lab.*'
      - 'tests/guard-correction-idempotence.test.js'
      - 'tests/parry-rotation-continuity.test.js'
      - 'tests/parry-upper-body-continuity.test.js'
      - '.github/workflows/parry-rotation-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Guard correction + G3.6 Power Parry continuity unit tests
        run: node --test tests/guard-correction-idempotence.test.js tests/parry-rotation-continuity.test.js tests/parry-upper-body-continuity.test.js tests/parry-contact-deflect-runtime-clip.test.js

      - name: Locate headless browser
        id: browser
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
          "$BROWSER" --version

      - name: Verify G3.6 Power Parry 0-599ms rotation continuity
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          mkdir -p artifacts/g3-6-power-parry-continuity
          python3 -m http.server 4173 > /tmp/g36-continuity-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          URL='http://127.0.0.1:4173/tools/action-studio/parry-rotation-continuity-lab.html'
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1280,900 --virtual-time-budget=30000 --dump-dom \
            "$URL" > artifacts/g3-6-power-parry-continuity/continuity-dom.html

          if ! grep -q 'data-g36="pass"' artifacts/g3-6-power-parry-continuity/continuity-dom.html; then
            echo 'G3.6 Power Parry continuity report:' >&2
            sed -n '/<pre id="report"/,/<\/pre>/p' artifacts/g3-6-power-parry-continuity/continuity-dom.html >&2 || true
            exit 1
          fi
          grep -q 'data-g36-policy="pass"' artifacts/g3-6-power-parry-continuity/continuity-dom.html
          grep -q 'data-g36-power="pass"' artifacts/g3-6-power-parry-continuity/continuity-dom.html
          grep -q 'data-g36-root="pass"' artifacts/g3-6-power-parry-continuity/continuity-dom.html
          grep -q 'data-g36-hips="pass"' artifacts/g3-6-power-parry-continuity/continuity-dom.html
          grep -q 'data-g36-spine="pass"' artifacts/g3-6-power-parry-continuity/continuity-dom.html
          grep -q 'data-g36-chest="pass"' artifacts/g3-6-power-parry-continuity/continuity-dom.html

      - name: Upload G3.6 Power Parry continuity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-6-power-parry-motion-continuity
          path: artifacts/g3-6-power-parry-continuity
