name: G3.6.3 Power Parry Runtime Visual

on:
  pull_request:
    paths:
      - 'assets/skyrim/guard/converted/**'
      - 'src/animation/skyrim-converted-animation-library.js'
      - 'src/animation/parry-contact-deflect-runtime-clip.js'
      - 'src/animation/parry-upper-body-continuity.js'
      - 'src/animation/power-bash-readability-probe.js'
      - 'src/combat/guard-*.js'
      - 'src/combat/longsword-guard-*.js'
      - 'tests/power-bash-readability-probe.test.js'
      - 'tools/action-studio/guard-reaction-runtime-lab.*'
      - 'tools/action-studio/power-bash-readability-lab.*'
      - '.github/workflows/guard-reaction-runtime-visual.yml'
  # R21H.1: these gates only ever fired on pull_request, and this repository reaches main by
  # fast-forward rather than by pull request - so this workflow had never run, not once. The paths
  # filter below is what keeps that cheap: the gate wakes only when the code it guards moves.
  push:
    branches: ['**']
    paths:
      - 'assets/skyrim/guard/converted/**'
      - 'src/animation/skyrim-converted-animation-library.js'
      - 'src/animation/parry-contact-deflect-runtime-clip.js'
      - 'src/animation/parry-upper-body-continuity.js'
      - 'src/animation/power-bash-readability-probe.js'
      - 'src/combat/guard-*.js'
      - 'src/combat/longsword-guard-*.js'
      - 'tests/power-bash-readability-probe.test.js'
      - 'tools/action-studio/guard-reaction-runtime-lab.*'
      - 'tools/action-studio/power-bash-readability-lab.*'
      - '.github/workflows/guard-reaction-runtime-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen Skyrim source assets
        run: node build/verify-frozen-sources.mjs

      - name: Run G3.6.3 production motion contract tests
        run: node --test tests/parry-contact-deflect-runtime-clip.test.js tests/guard-reaction-presentation.test.js tests/guard-state-machine.test.js tests/guard-presentation-runtime.test.js tests/power-bash-readability-probe.test.js

      - name: Locate headless browser
        id: browser
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
          "$BROWSER" --version

      - name: Verify G3.6.3 production Guard Block and promoted D Power Parry runtime
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          mkdir -p artifacts/g3-6-3-power-parry
          python3 -m http.server 4173 > /tmp/g363-runtime-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BASE='http://127.0.0.1:4173/tools/action-studio/guard-reaction-runtime-lab.html'
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=30000 --dump-dom \
            "${BASE}?reaction=parry&elapsed=820&view=three" > artifacts/g3-6-3-power-parry/g363-dom.html
          if ! grep -q 'data-g363="pass"' artifacts/g3-6-3-power-parry/g363-dom.html; then
            echo 'G3.6.3 promoted D runtime visual gate failed.' >&2
            sed -n '/<pre id="report"/,/<\/pre>/p' artifacts/g3-6-3-power-parry/g363-dom.html || true
            exit 1
          fi
          grep -q 'data-g332-count="6"' artifacts/g3-6-3-power-parry/g363-dom.html
          grep -q 'data-g332-block="pass"' artifacts/g3-6-3-power-parry/g363-dom.html
          grep -q 'data-g332-parry="pass"' artifacts/g3-6-3-power-parry/g363-dom.html
          grep -q 'data-g332-perfect="pass"' artifacts/g3-6-3-power-parry/g363-dom.html
          grep -q 'data-g363-virtual="pass"' artifacts/g3-6-3-power-parry/g363-dom.html
          grep -q 'data-g363-power="pass"' artifacts/g3-6-3-power-parry/g363-dom.html
          grep -q 'data-g363-recovery="pass"' artifacts/g3-6-3-power-parry/g363-dom.html
          grep -q 'data-g363-shared-motion="pass"' artifacts/g3-6-3-power-parry/g363-dom.html
          grep -q 'data-g363-block-semantic="pass"' artifacts/g3-6-3-power-parry/g363-dom.html

          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=22000 \
            --screenshot="artifacts/g3-6-3-power-parry/guard-block-300ms.png" \
            "${BASE}?reaction=block&elapsed=300&view=three"

          for elapsed in 150 235 450 700 820 900 940; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
              --window-size=1500,1000 --virtual-time-budget=22000 \
              --screenshot="artifacts/g3-6-3-power-parry/parry-${elapsed}ms.png" \
              "${BASE}?reaction=parry&elapsed=${elapsed}&view=three"
          done

          for elapsed in 700 820 900; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
              --window-size=1500,1000 --virtual-time-budget=22000 \
              --screenshot="artifacts/g3-6-3-power-parry/parry-side-${elapsed}ms.png" \
              "${BASE}?reaction=parry&elapsed=${elapsed}&view=side"
          done

          for elapsed in 150 450 700 820 900 940; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
              --window-size=1500,1000 --virtual-time-budget=22000 \
              --screenshot="artifacts/g3-6-3-power-parry/perfect-${elapsed}ms.png" \
              "${BASE}?reaction=perfect&elapsed=${elapsed}&view=three"
          done

      - name: Verify G3.6.3 D production decision history lab
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          mkdir -p artifacts/g3-6-3-d-production-history
          python3 -m http.server 4174 > /tmp/g363-readability-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BASE='http://127.0.0.1:4174/tools/action-studio/power-bash-readability-lab.html'
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1700,1100 --virtual-time-budget=30000 --dump-dom \
            "${BASE}?progress=0.90&view=three" > artifacts/g3-6-3-d-production-history/g363-history-dom.html
          if ! grep -q 'data-g361="pass"' artifacts/g3-6-3-d-production-history/g363-history-dom.html; then
            echo 'G3.6.3 D production history lab failed.' >&2
            sed -n '/<pre id="report"/,/<\/pre>/p' artifacts/g3-6-3-d-production-history/g363-history-dom.html || true
            exit 1
          fi
          grep -q 'data-g363-production-promoted="pass"' artifacts/g3-6-3-d-production-history/g363-history-dom.html
          grep -q 'data-g361-current-short="pass"' artifacts/g3-6-3-d-production-history/g363-history-dom.html
          grep -q 'data-g361-extended-longer="pass"' artifacts/g3-6-3-d-production-history/g363-history-dom.html
          grep -q 'data-g362-power-matches-c="pass"' artifacts/g3-6-3-d-production-history/g363-history-dom.html
          grep -q 'data-g362-recovery="pass"' artifacts/g3-6-3-d-production-history/g363-history-dom.html

          for progress in 0.25 0.50 0.75 0.90 1.00; do
            tag="${progress/./}"
            "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
              --window-size=1700,1100 --virtual-time-budget=26000 \
              --screenshot="artifacts/g3-6-3-d-production-history/abcd-progress-${tag}.png" \
              "${BASE}?progress=${progress}&view=three"
          done
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1700,1100 --virtual-time-budget=26000 \
            --screenshot="artifacts/g3-6-3-d-production-history/d-production-recovery-090.png" \
            "${BASE}?progress=0.90&view=front"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1700,1100 --virtual-time-budget=26000 \
            --screenshot="artifacts/g3-6-3-d-production-history/d-production-reset-100.png" \
            "${BASE}?progress=1.00&view=front"

      - name: Upload G3.6.3 Power Parry runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-6-3-promoted-d-power-parry-runtime
          path: artifacts/g3-6-3-power-parry

      - name: Upload G3.6.3 D production history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-6-3-d-production-history
          path: artifacts/g3-6-3-d-production-history
