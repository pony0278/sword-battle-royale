name: CI

on:
  pull_request:
    branches: [main]
  # R21H.1: every branch, not just main. This ran on push to main only, which meant the suite, the
  # staleness check, the browser surface check and the measured-combat gates all reported AFTER a
  # fast-forward had already put the change on main - the one moment their verdict could not be
  # acted on. Work happens on branches here and reaches main by fast-forward, so the branch push is
  # where CI has to speak.
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Action Studio
        run: npm run build:action-studio

      - name: Verify standalone Action Studio files are current
        shell: bash
        run: |
          if ! git diff --exit-code -- tools/action-studio/action-studio.bundle.js tools/action-studio/index.html; then
            echo 'Generated standalone Action Studio files are stale.' >&2
            echo 'Run npm run build:action-studio and commit tools/action-studio/action-studio.bundle.js + index.html.' >&2
            exit 1
          fi

      - name: Verify Action Studio Guard Runtime browser surface
        shell: bash
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      - name: Run tests
        run: npm test

      # S1.C2: type checking, opted into one file at a time. checkJs is off in tsconfig.json and a
      # file joins by carrying `// @ts-check`, so this gate reports on the seams rather than on the
      # whole of src/ - which measured 244 errors, none of them defects. Runs after the tests
      # because a type error is cheaper to read than a failing assertion, but never instead of them:
      # this repository's bugs are wrong measurements, and those are all correctly typed.
      - name: Typecheck the opted-in seams
        run: npm run typecheck

      # Vite: the bundled page has to boot before the combat gates drive it. A separate step from
      # verify:combat because the two answer different questions - this one asks whether the page
      # runs at all, and names the resource when it does not.
      - name: Verify the bundled lab boots
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run build:web && npm run verify:built-lab

      # R20Z.1: the two gates that protect the measured combat. The golden grid replays eleven
      # exchanges and diffs every outcome, posture, relevance verdict and separation against the
      # committed record; the parry gate plays one parry per direction and reads the in-page
      # verdicts. Both existed before this and neither ran anywhere - they drive a page that was
      # gitignored, so CI could not have run them even if a workflow had asked.
      # Vite: they drive the BUILT page now. verify:combat runs the build itself and serves dist/,
      # so what is measured is what the site publishes - there is no second page to keep in step.
      - name: Verify measured combat (golden grid + parry gate)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:combat
