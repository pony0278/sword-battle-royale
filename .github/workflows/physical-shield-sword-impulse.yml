name: G4.3B.5R.2.9 Physical Shield-Sword Impulse

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/combat/physical-shield-sword-impulse.js'
      - 'tools/action-studio/physical-shield-sword-impulse-lab.html'
      - 'tools/action-studio/physical-shield-sword-impulse-lab.js'
      - 'tools/action-studio/physical-shield-sword-impulse-lab-r29.html'
      - 'tools/action-studio/physical-shield-sword-impulse-lab-r29.js'
      - 'tests/physical-shield-sword-impulse.test.js'
      - 'tests/physical-shield-sword-impulse-lab.test.js'
      - '.github/workflows/physical-shield-sword-impulse.yml'
  # R21H.1: was pinned to 'g43b5r28-legacy-two-actor-recoil-passthrough', a branch still on the
  # remote that nobody has pushed to in months - which is indistinguishable from having no push
  # trigger at all, and reads as coverage while providing none. Retargeted, with the paths filter
  # mirrored from pull_request so it stays cheap. NOTE: every test this runs is already run by
  # `npm test` in ci.yml, so what this buys is a faster, narrower signal, not new coverage.
  push:
    branches: ['**']
    paths:
      - 'src/combat/physical-shield-sword-impulse.js'
      - 'tools/action-studio/physical-shield-sword-impulse-lab.html'
      - 'tools/action-studio/physical-shield-sword-impulse-lab.js'
      - 'tools/action-studio/physical-shield-sword-impulse-lab-r29.html'
      - 'tools/action-studio/physical-shield-sword-impulse-lab-r29.js'
      - 'tests/physical-shield-sword-impulse.test.js'
      - 'tests/physical-shield-sword-impulse-lab.test.js'
      - '.github/workflows/physical-shield-sword-impulse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-shield-sword-impulse-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify physical solver and corrected lab syntax
        run: >-
          node --check src/combat/physical-shield-sword-impulse.js
          && node --check tools/action-studio/physical-shield-sword-impulse-lab-r29.js

      - name: Run physical impulse and visual-authority regressions
        run: >-
          node --test
          tests/physical-shield-sword-impulse.test.js
          tests/physical-shield-sword-impulse-lab.test.js
