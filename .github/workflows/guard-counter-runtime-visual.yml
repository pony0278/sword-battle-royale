name: G3.4 Guard Counter Runtime Visual

on:
  pull_request:
    paths:
      - 'assets/kaykit/animations/melee.glb'
      - 'assets/skyrim/guard/converted/**'
      - 'src/animation/kaykit-animation-library.js'
      - 'src/animation/skyrim-*.js'
      - 'src/combat/guard-*.js'
      - 'src/combat/longsword-guard-*.js'
      - 'src/character/character-sockets.js'
      - 'src/character/default-character-mount.js'
      - 'tools/action-studio/guard-counter-runtime-lab.*'
      - 'tools/action-studio/counter-recover-first-frame-lab.*'
      - '.github/workflows/guard-counter-runtime-visual.yml'
  # R21H.1: these gates only ever fired on pull_request, and this repository reaches main by
  # fast-forward rather than by pull request - so this workflow had never run, not once. The paths
  # filter below is what keeps that cheap: the gate wakes only when the code it guards moves.
  push:
    branches: ['**']
    paths:
      - 'assets/kaykit/animations/melee.glb'
      - 'assets/skyrim/guard/converted/**'
      - 'src/animation/kaykit-animation-library.js'
      - 'src/animation/skyrim-*.js'
      - 'src/combat/guard-*.js'
      - 'src/combat/longsword-guard-*.js'
      - 'src/character/character-sockets.js'
      - 'src/character/default-character-mount.js'
      - 'tools/action-studio/guard-counter-runtime-lab.*'
      - 'tools/action-studio/counter-recover-first-frame-lab.*'
      - '.github/workflows/guard-counter-runtime-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate headless browser
        id: browser
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
          "$BROWSER" --version

      - name: Verify G3.4 authoritative Counter runtime
        shell: bash
        env:
          BROWSER: ${{ steps.browser.outputs.browser }}
        run: |
          mkdir -p artifacts/g3-4 artifacts/g3-4/silhouette
          python3 -m http.server 4173 > /tmp/g34-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BASE='http://127.0.0.1:4173/tools/action-studio/guard-counter-runtime-lab.html'
          FIRST_FRAME_BASE='http://127.0.0.1:4173/tools/action-studio/counter-recover-first-frame-lab.html'

          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=35000 --dump-dom \
            "${BASE}?variant=normal&elapsed=220&view=three" > artifacts/g3-4/g34-dom.html

          if ! grep -q 'data-g34="pass"' artifacts/g3-4/g34-dom.html; then
            echo 'G3.4 runtime visual gate failed.' >&2
            sed -n '/<pre id="report"/,/<\/pre>/p' artifacts/g3-4/g34-dom.html || true
            cat /tmp/g34-http.log || true
            exit 1
          fi
          grep -q 'data-g34-normal="pass"' artifacts/g3-4/g34-dom.html
          grep -q 'data-g34-perfect="pass"' artifacts/g3-4/g34-dom.html
          grep -q 'data-g34-counter-clip="pass"' artifacts/g3-4/g34-dom.html
          grep -q 'data-g3411-world-sword="pass"' artifacts/g3-4/g34-dom.html

          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1200,900 --virtual-time-budget=35000 --dump-dom \
            "${FIRST_FRAME_BASE}" > artifacts/g3-4/g3412-first-frame-dom.html

          if ! grep -q 'data-g3412="pass"' artifacts/g3-4/g3412-first-frame-dom.html; then
            echo 'G3.4.1.2 Counter Recover first-frame continuity gate failed.' >&2
            sed -n '/<pre id="report"/,/<\/pre>/p' artifacts/g3-4/g3412-first-frame-dom.html || true
            cat /tmp/g34-http.log || true
            exit 1
          fi
          grep -q 'data-g3412-zero="pass"' artifacts/g3-4/g3412-first-frame-dom.html
          grep -q 'data-g3412-first-frame="pass"' artifacts/g3-4/g3412-first-frame-dom.html
          grep -q 'data-g3412-second-frame="pass"' artifacts/g3-4/g3412-first-frame-dom.html

          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=25000 \
            --screenshot="artifacts/g3-4/normal-counter-220ms.png" \
            "${BASE}?variant=normal&elapsed=220&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=25000 \
            --screenshot="artifacts/g3-4/perfect-counter-220ms.png" \
            "${BASE}?variant=perfect&elapsed=220&view=three"
          "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
            --window-size=1500,1000 --virtual-time-budget=25000 \
            --screenshot="artifacts/g3-4/perfect-counter-220ms-side.png" \
            "${BASE}?variant=perfect&elapsed=220&view=side"

          # G3.4.2 tuned presentation checkpoints for the ~1066.67 ms Counter.
          # Presentation anchors 18/30/38/50/76/94% => ~192/320/405/533/811/1003 ms.
          for SPEC in '18:192' '30:320' '38:405' '50:533' '76:811' '94:1003'; do
            PCT="${SPEC%%:*}"
            MS="${SPEC##*:}"
            "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
              --window-size=1500,1000 --virtual-time-budget=25000 \
              --screenshot="artifacts/g3-4/silhouette/tuned-${PCT}pct-three.png" \
              "${BASE}?variant=normal&elapsed=${MS}&view=three"
          done
          for SPEC in '30:320' '38:405' '50:533' '76:811'; do
            PCT="${SPEC%%:*}"
            MS="${SPEC##*:}"
            "$BROWSER" --headless --no-sandbox --disable-gpu --enable-unsafe-swiftshader --hide-scrollbars \
              --window-size=1500,1000 --virtual-time-budget=25000 \
              --screenshot="artifacts/g3-4/silhouette/tuned-${PCT}pct-side.png" \
              "${BASE}?variant=normal&elapsed=${MS}&view=side"
          done

      - name: Upload G3.4 runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: g3-4-guard-counter-runtime-visual
          path: artifacts/g3-4
