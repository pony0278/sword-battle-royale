name: G4.3B.5R.2.9.2R1.1 Anatomical 3D Joint Response

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/combat/anatomical-3d-joint-response.js'
      - 'src/combat/swept-blade-shield-physical-contact.js'
      - 'src/combat/physical-shield-sword-impulse.js'
      - 'tools/action-studio/anatomical-3d-joint-response-lab-r292r11.html'
      - 'tools/action-studio/anatomical-3d-joint-response-lab-r292r11.js'
      - 'tests/anatomical-3d-joint-response.test.js'
      - 'tests/anatomical-3d-joint-response-lab.test.js'
      - '.github/workflows/anatomical-3d-joint-response.yml'
  # R21H.1: was pinned to 'g43b5r28-legacy-two-actor-recoil-passthrough', a branch still on the
  # remote that nobody has pushed to in months - which is indistinguishable from having no push
  # trigger at all, and reads as coverage while providing none. Retargeted, with the paths filter
  # mirrored from pull_request so it stays cheap. NOTE: every test this runs is already run by
  # `npm test` in ci.yml, so what this buys is a faster, narrower signal, not new coverage.
  push:
    branches: ['**']
    paths:
      - 'src/combat/anatomical-3d-joint-response.js'
      - 'src/combat/swept-blade-shield-physical-contact.js'
      - 'src/combat/physical-shield-sword-impulse.js'
      - 'tools/action-studio/anatomical-3d-joint-response-lab-r292r11.html'
      - 'tools/action-studio/anatomical-3d-joint-response-lab-r292r11.js'
      - 'tests/anatomical-3d-joint-response.test.js'
      - 'tests/anatomical-3d-joint-response-lab.test.js'
      - '.github/workflows/anatomical-3d-joint-response.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anatomical-3d-joint-response-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify anatomical 3D runtime and lab syntax
        run: >-
          node --check src/combat/anatomical-3d-joint-response.js
          && node --check src/combat/swept-blade-shield-physical-contact.js
          && node --check src/combat/physical-shield-sword-impulse.js
          && node --check tools/action-studio/anatomical-3d-joint-response-lab-r292r11.js

      - name: Run anatomical 3D and swept-contact regressions
        run: >-
          node --test
          tests/anatomical-3d-joint-response.test.js
          tests/anatomical-3d-joint-response-lab.test.js
          tests/swept-blade-shield-physical-contact.test.js
          tests/physical-shield-sword-impulse.test.js
