name: Deploy GitHub Pages

# GitHub Pages serves one site per repository, so per-branch preview URLs come
# from subdirectories of a single gh-pages branch rather than separate sites:
#
#   main               -> https://<owner>.github.io/<repo>/
#   any other branch   -> https://<owner>.github.io/<repo>/preview/<slug>/
#
# Requires the repository Pages source to be "Deploy from a branch" -> gh-pages / root.

on:
  push:
    branches:
      - main
      - '**-preview'
  delete:
  workflow_dispatch:

permissions:
  contents: write

# Every job writes the same branch, so they must queue instead of racing.
# Cancelling mid-run would abandon a half-written tree.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Action Studio
        run: npm run build:action-studio

      # Vite: the page the community plays is bundled. publish-gh-pages.sh overlays the built
      # page and its chunks onto the repository copy, and refuses to publish without them.
      - name: Build the web bundle
        run: npm run build:web

      # main is the published site and stays gated. A preview exists precisely
      # so work in progress can be looked at, so a failing gate is reported
      # without blocking the deploy.
      - name: Verify Action Studio Guard Runtime browser surface
        continue-on-error: ${{ github.ref_name != 'main' }}
        run: bash tools/action-studio/verify-guard-runtime-surface.sh

      # The Action Studio this workflow publishes is the BUILT page, so the built page is what has
      # to answer before it ships. Same posture as the gate above: main is gated, a preview reports.
      - name: Verify the bundled Action Studio boots and its Guard Runtime answers
        continue-on-error: ${{ github.ref_name != 'main' }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:built-studio

      # The script clones gh-pages into its own directory, which does not
      # inherit the credentials actions/checkout scoped to this workspace.
      - name: Publish to gh-pages
        env:
          GH_PAGES_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash build/publish-gh-pages.sh publish "${GITHUB_REF_NAME}"

      - name: Summarize
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            url="$base/"
          else
            slug="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')"
            url="$base/preview/$slug/"
          fi
          {
            echo "### Published \`${GITHUB_REF_NAME}\`"
            echo
            echo "- Site: $url"
            echo "- Shield parry lab: ${url}tools/action-studio/shield-driven-contact-coupling-lab.html"
            echo "- All previews: $base/preview/"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Drop the preview for the deleted branch
        env:
          GH_PAGES_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash build/publish-gh-pages.sh remove "${{ github.event.ref }}"
